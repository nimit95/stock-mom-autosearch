services:
  dashboard:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - mom-cache:/root/.cache/mom-autosearch
      - ./.env:/app/.env:ro
    restart: unless-stopped
    command: python3 dashboard.py

  # Weekly rebalance - run manually or via cron on host:
  #   docker compose run --rm rebalance python3 rebalance.py --dry-run
  rebalance:
    build: .
    volumes:
      - ./data:/app/data
      - mom-cache:/root/.cache/mom-autosearch
      - ./.env:/app/.env:ro
      - ./.kite_token:/app/.kite_token
    profiles: ["cli"]
    command: python3 rebalance.py --dry-run

volumes:
  mom-cache:
